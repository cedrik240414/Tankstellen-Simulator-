name: Tests und GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'Cloudflare API Token (nur für dieses eine Veröffentlichen, wird nicht gespeichert)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      # Spiel-Server (Cloudflare Worker) – nur wenn die Secrets gesetzt sind und auf main
      - name: Server veröffentlichen
        id: worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Token aus dem manuellen Start übernehmen (wird in den Logs verborgen)
          IN_TOKEN=$(jq -r '.inputs.cf_token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$IN_TOKEN" ]; then echo "::add-mask::$IN_TOKEN"; export CLOUDFLARE_API_TOKEN="$IN_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID=3440183c56ca9fbf69d17d9f7dcc3e27; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Kein CLOUDFLARE_API_TOKEN gesetzt – das Spiel läuft im Offline-Modus."
            exit 0
          fi
          cd worker
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Server-Adresse: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Spiel bauen
        run: npm run build
        env:
          VITE_API_URL: ${{ steps.worker.outputs.url || vars.API_URL || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # veröffentlicht nur von main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
